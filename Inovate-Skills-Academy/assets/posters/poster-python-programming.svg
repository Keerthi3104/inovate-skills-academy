<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082F49"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <pattern id="dotPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#bgGrad2)"/>
  <rect width="800" height="1000" fill="url(#dotPattern)"/>
  <rect x="0" y="0" width="800" height="12" fill="url(#tealGrad)"/>

  <!-- Glowing Accents -->
  <circle cx="150" cy="220" r="280" fill="#0D9488" opacity="0.09" filter="blur(70px)"/>
  <circle cx="720" cy="780" r="240" fill="#38BDF8" opacity="0.08" filter="blur(65px)"/>

  <!-- Company Header -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="90" y="22" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2DD4BF" text-anchor="middle" letter-spacing="2">SKILLS ACADEMY</text>
    <text x="0" y="70" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">INOVATE SOLUTION TECHNOLOGY</text>
  </g>

  <!-- Notice Badge -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="680" height="42" rx="8" fill="rgba(20, 184, 166, 0.12)" stroke="#14B8A6" stroke-width="1.2" stroke-dasharray="6,4"/>
    <text x="340" y="26" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2DD4BF" text-anchor="middle">
      [PROMOTIONAL POSTER PLACEHOLDER 02 — REPLACE WITH COMPANY APPROVED ASSET]
    </text>
  </g>

  <!-- Main Headline Block -->
  <g transform="translate(60, 245)">
    <text x="0" y="32" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#2DD4BF" letter-spacing="3">APPLIED PROGRAMMING TRACK</text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">Python &amp; Core</text>
    <text x="0" y="145" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="46" font-weight="800" fill="#2DD4BF">Software Foundations</text>
    <text x="0" y="195" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94A3B8">
      Build foundational logic, algorithmic thinking, and real-world backend scripting
    </text>
    <text x="0" y="222" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94A3B8">
      with step-by-step guidance tailored for beginners and career-switchers.
    </text>
  </g>

  <!-- Focus Areas -->
  <g transform="translate(60, 500)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="325" height="195" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.1)"/>
      <text x="28" y="45" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="18" font-weight="700" fill="#38BDF8">Core Fundamentals</text>
      <text x="28" y="75" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">• Data types, control structures, functions</text>
      <text x="28" y="105" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">• Object-oriented programming principles</text>
      <text x="28" y="135" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">• Modular code organisation &amp; debugging</text>
      <text x="28" y="165" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">• File operations &amp; standard libraries</text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(355, 0)">
      <rect x="0" y="0" width="325" height="195" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.1)"/>
      <text x="28" y="45" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="18" font-weight="700" fill="#2DD4BF">Applied Practice</text>
      <text x="28" y="75" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">• Database connectivity with SQL</text>
      <text x="28" y="105" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">• RESTful endpoints &amp; JSON handling</text>
      <text x="28" y="135" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">• Practical software mini-projects</text>
      <text x="28" y="165" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">• Code review &amp; best practice guidelines</text>
    </g>
  </g>

  <!-- Bottom Details Strip -->
  <g transform="translate(60, 735)">
    <rect x="0" y="0" width="680" height="120" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.12)"/>
    <text x="35" y="45" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Enquire About Upcoming Batches</text>
    <text x="35" y="75" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">Open for College Students, Fresh Graduates &amp; Working Professionals.</text>
    <text x="35" y="98" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2DD4BF">Contact: ist@inovatesolutiontechnology.in | Phone: +91 77086 97677</text>

    <!-- Button Graphic -->
    <rect x="490" y="38" width="155" height="46" rx="8" fill="url(#tealGrad)"/>
    <text x="567" y="66" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">LEARN MORE</text>
  </g>

  <!-- Footer Watermark -->
  <g transform="translate(60, 930)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B">
      © Inovate Solution Technology — Skills Academy Division. Official Promotional Sample Template.
    </text>
    <text x="0" y="22" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569">
      Dimensions: 800 x 1000px | Aspect Ratio: 4:5 Portrait | Formatted for High-Resolution Display
    </text>
  </g>
</svg>