<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="60%" stop-color="#1E3E62"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad1)"/>
  <rect width="800" height="1000" fill="url(#gridPattern)"/>

  <!-- Top Decorative Bar -->
  <rect x="0" y="0" width="800" height="12" fill="url(#accentGrad1)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="700" cy="180" r="260" fill="#0EA5E9" opacity="0.08" filter="blur(60px)"/>
  <circle cx="100" cy="850" r="220" fill="#0D9488" opacity="0.08" filter="blur(60px)"/>

  <!-- Company Header -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="90" y="22" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="2">SKILLS ACADEMY</text>
    <text x="0" y="70" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">INOVATE SOLUTION TECHNOLOGY</text>
  </g>

  <!-- Notice Badge -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="680" height="42" rx="8" fill="rgba(249, 115, 22, 0.12)" stroke="#F97316" stroke-width="1.2" stroke-dasharray="6,4"/>
    <text x="340" y="26" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FB923C" text-anchor="middle">
      [PROMOTIONAL POSTER PLACEHOLDER 01 — REPLACE WITH COMPANY APPROVED ASSET]
    </text>
  </g>

  <!-- Main Headline Block -->
  <g transform="translate(60, 245)">
    <text x="0" y="32" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0EA5E9" letter-spacing="3">CAREER-ORIENTED SPECIALISATION</text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" line-height="1.2">Full Stack Software</text>
    <text x="0" y="145" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="46" font-weight="800" fill="#38BDF8">Development Track</text>
    <text x="0" y="195" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94A3B8">
      Master modern frontend frameworks, robust backend APIs, and database design
    </text>
    <text x="0" y="222" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94A3B8">
      through structured, project-centred technical mentorship.
    </text>
  </g>

  <!-- Key Curriculum Pillars (Cards) -->
  <g transform="translate(60, 500)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="210" height="200" rx="12" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="45" cy="45" r="22" fill="rgba(14, 165, 233, 0.15)"/>
      <text x="45" y="52" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#38BDF8" text-anchor="middle">01</text>
      <text x="24" y="100" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Frontend Craft</text>
      <text x="24" y="128" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">HTML5, CSS3, JS,</text>
      <text x="24" y="150" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">Bootstrap &amp; Modern</text>
      <text x="24" y="172" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">Component Design</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(235, 0)">
      <rect x="0" y="0" width="210" height="200" rx="12" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="45" cy="45" r="22" fill="rgba(13, 148, 136, 0.15)"/>
      <text x="45" y="52" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#2DD4BF" text-anchor="middle">02</text>
      <text x="24" y="100" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Backend Logic</text>
      <text x="24" y="128" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">RESTful Architecture,</text>
      <text x="24" y="150" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">Server Frameworks,</text>
      <text x="24" y="172" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">Authentication &amp; APIs</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(470, 0)">
      <rect x="0" y="0" width="210" height="200" rx="12" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="45" cy="45" r="22" fill="rgba(249, 115, 22, 0.15)"/>
      <text x="45" y="52" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#FB923C" text-anchor="middle">03</text>
      <text x="24" y="100" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Data &amp; Practice</text>
      <text x="24" y="128" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">SQL Schemas, Data</text>
      <text x="24" y="150" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">Integrity, Versioning</text>
      <text x="24" y="172" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">&amp; Capstone Build</text>
    </g>
  </g>

  <!-- Bottom Details & Enquiries Strip -->
  <g transform="translate(60, 735)">
    <rect x="0" y="0" width="680" height="120" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.12)"/>
    
    <text x="35" y="45" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Ready to Learn Hands-On?</text>
    <text x="35" y="75" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">Connect directly with our training team in Madurai, Tamil Nadu.</text>
    <text x="35" y="98" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Email: ist@inovatesolutiontechnology.in | Phone: +91 77086 97677</text>

    <!-- Button Graphic -->
    <rect x="490" y="38" width="155" height="46" rx="8" fill="url(#coralGrad)"/>
    <text x="567" y="66" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">ENQUIRE NOW</text>
  </g>

  <!-- Footer Watermark -->
  <g transform="translate(60, 930)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B">
      © Inovate Solution Technology — Skills Academy Division. Official Promotional Sample Template.
    </text>
    <text x="0" y="22" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569">
      Dimensions: 800 x 1000px | Aspect Ratio: 4:5 Portrait | Formatted for High-Resolution Display
    </text>
  </g>
</svg>